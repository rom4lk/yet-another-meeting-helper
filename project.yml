name: MeetingsHelper

options:
  bundleIdPrefix: com.kovalev
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7TASY9A6C5
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MeetingsHelper:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Require Code Signing
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED:-}" != "YES" ]; then
            echo "error: MeetingsHelper must be code signed because macOS privacy permissions depend on a stable code identity."
            exit 1
          fi
    sources:
      - path: Sources/MeetingsHelper
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovalev.MeetingsHelper
        PRODUCT_NAME: MeetingsHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Resources/MeetingsHelper.entitlements
      properties:
        # The app is intentionally NOT sandboxed: Core Audio process taps scoped to a
        # specific process and the Accessibility API (used to read meeting window titles)
        # are both unavailable inside the App Sandbox.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeetingsHelper
        CFBundleDisplayName: Meetings Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Records your voice during the meeting."
        NSAudioCaptureUsageDescription: "Records the other participants' voices from the meeting app's audio stream."
        NSCalendarsFullAccessUsageDescription: "Fills in the meeting title from your calendar."
