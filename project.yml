name: MeetingHelper

options:
  bundleIdPrefix: com.kovalev
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: "1.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.5"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  MeetingHelper:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Require Code Signing
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED:-}" != "YES" ]; then
            echo "error: MeetingHelper must be code signed because macOS privacy permissions depend on a stable code identity."
            exit 1
          fi
          if [ -z "${DEVELOPMENT_TEAM:-}" ]; then
            echo "error: Set DEVELOPMENT_TEAM in Config/LocalSigning.xcconfig. Ad-hoc signatures invalidate macOS privacy permissions after every rebuild."
            exit 1
          fi
          if [ "${CODE_SIGN_IDENTITY:-}" = "-" ]; then
            echo "error: Ad-hoc code signing is not supported because it invalidates macOS privacy permissions after every rebuild."
            exit 1
          fi
    sources:
      - path: Sources/MeetingHelper
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovalev.MeetingHelper
        PRODUCT_NAME: MeetingHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: Resources/MeetingHelper.entitlements
      properties:
        # The app is intentionally NOT sandboxed: Core Audio process taps scoped to a
        # specific process and the Accessibility API (used to read meeting window titles)
        # are both unavailable inside the App Sandbox.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeetingHelper
        CFBundleDisplayName: Meeting Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Records your voice during the meeting."
        NSAudioCaptureUsageDescription: "Records the other participants' voices from the meeting app's audio stream."
        NSCalendarsFullAccessUsageDescription: "Fills in the meeting title from your calendar."
  MeetingHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MeetingHelperTests
    dependencies:
      - target: MeetingHelper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
  MeetingHelperUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/MeetingHelperUITests
    dependencies:
      - target: MeetingHelper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

schemes:
  MeetingHelper:
    build:
      targets:
        MeetingHelper: all
    test:
      targets:
        - MeetingHelperTests
        - MeetingHelperUITests
